
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b12">
<title>ROHIT IoT — Control Center</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090b12;color:#f8fafc;
  font-family:Inter,system-ui,Arial,sans-serif;
  min-height:100vh
}
button,input{font:inherit}
.container{max-width:1050px;margin:auto;padding:28px 20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:65px}
.logo{font-size:24px;font-weight:900;letter-spacing:-1px}
.logo span{color:#ef4444}
.tag{border:1px solid #293244;border-radius:30px;padding:9px 13px;font-size:11px;color:#a4adbd}
h1{font-size:clamp(36px,6vw,55px);letter-spacing:-2px;margin:5px 0}
.muted{color:#929caf}
.card,.device{
  background:#111722;border:1px solid #283244;
  border-radius:18px;padding:25px
}
.login{max-width:420px;margin:70px auto}
input{
  width:100%;padding:15px;margin:15px 0;
  background:#090e17;border:1px solid #303b4e;
  border-radius:10px;color:white;outline:none
}
input:focus{border-color:#ef4444}
button{border:0;border-radius:10px;padding:13px 18px;cursor:pointer;font-weight:700}
.primary{background:#ef4444;color:white;width:100%}
.secondary{background:#283244;color:white}
.hidden{display:none!important}
.info{
  display:flex;align-items:center;justify-content:space-between;
  gap:15px;flex-wrap:wrap;margin-top:25px
}
.info h3{margin-bottom:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:20px}
.top{display:flex;justify-content:space-between;align-items:center}
.top h2{font-size:20px}
.status{font-size:11px;padding:7px 10px;border-radius:20px;background:#382d17;color:#fbbf24}
.status.active{background:#123522;color:#4ade80}
.state{font-size:38px;font-weight:900;margin:28px 0}
.actions{display:flex;gap:12px}
.actions button{flex:1}
.onbtn{background:#16a34a;color:white}
.offbtn{background:#293345;color:white}
button:disabled{opacity:.5;cursor:wait}
.message{font-size:13px;color:#f87171;margin-top:12px}
footer{text-align:center;color:#687386;font-size:12px;margin-top:50px}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .container{padding:20px 14px}
  header{margin-bottom:45px}
  .card,.device{padding:19px}
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="logo">ROHIT<span>.</span>IoT</div>
  <div class="tag">REMOTE CONTROL CENTER</div>
</header>

<section id="login" class="card login">
  <h1>Welcome back.</h1>
  <p class="muted">Sign in to control your ESP8266.</p>
  <form id="loginForm">
    <input id="password" type="password"
      placeholder="Admin password" required>
    <button class="primary" type="submit">Sign In →</button>
  </form>
  <div id="error" class="message"></div>
</section>

<main id="dashboard" class="hidden">
  <p class="muted">YOUR SMART DEVICE</p>
  <h1>Control Center.</h1>
  <p class="muted">Manage your ESP8266 remotely.</p>

  <section class="card info">
    <div>
      <div class="muted">API CONNECTION</div>
      <h3 id="connection">Checking...</h3>
    </div>
    <div>
      <div class="muted">LAST UPDATE</div>
      <h3 id="updated">--</h3>
    </div>
    <button class="secondary" id="refresh">↻ Refresh</button>
  </section>

  <div class="grid">
    <section class="device">
      <div class="top">
        <h2>Relay 01</h2>
        <span class="status" id="status1">UNKNOWN</span>
      </div>
      <div class="state" id="state1">--</div>
      <div class="actions">
        <button class="onbtn" data-relay="relay1" data-value="ON">ON</button>
        <button class="offbtn" data-relay="relay1" data-value="OFF">OFF</button>
      </div>
    </section>

    <section class="device">
      <div class="top">
        <h2>Relay 02</h2>
        <span class="status" id="status2">UNKNOWN</span>
      </div>
      <div class="state" id="state2">--</div>
      <div class="actions">
        <button class="onbtn" data-relay="relay2" data-value="ON">ON</button>
        <button class="offbtn" data-relay="relay2" data-value="OFF">OFF</button>
      </div>
    </section>
  </div>

  <p style="text-align:right;margin-top:25px">
    <button class="secondary" id="logout">Sign Out</button>
  </p>
</main>

<footer>ROHIT IoT · REMOTE DEVICE MANAGEMENT</footer>
</div>

<script>
const API = "https://restless-glade-b1f1.rohitbiswas6009.workers.dev";

const $ = id => document.getElementById(id);
let token = sessionStorage.getItem("iot_token");
let timer = null;
let busy = false;

async function request(path, options={}) {
  const headers = {
    "Content-Type":"application/json",
    ...(options.auth ? {Authorization:"Bearer "+token} : {})
  };

  const res = await fetch(API+path,{
    ...options,
    headers
  });

  const data = await res.json().catch(()=>({}));

  if(!res.ok) {
    if(res.status===401 && options.auth) logout();
    throw new Error(data.error || "HTTP "+res.status);
  }

  return data;
}

function showDashboard(){
  $("login").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
}

function logout(){
  token=null;
  sessionStorage.removeItem("iot_token");
  clearInterval(timer);
  $("dashboard").classList.add("hidden");
  $("login").classList.remove("hidden");
}

function updateRelay(name,value){
  const n=name==="relay1"?1:2;
  if(!["ON","OFF"].includes(value)) value="UNKNOWN";

  $("state"+n).textContent=value;
  $("status"+n).textContent=value;
  $("status"+n).className=
    "status"+(value==="ON"?" active":"");
}

async function refreshStatus(){
  try{
    const data=await request("/api/state",{auth:true});

    updateRelay("relay1",data.relay1);
    updateRelay("relay2",data.relay2);

    $("connection").textContent="Connected";
    $("connection").style.color="#4ade80";
    $("updated").textContent=new Date().toLocaleTimeString();
  }catch(e){
    $("connection").textContent="API Error";
    $("connection").style.color="#f87171";
    console.error(e);
  }
}

async function setRelay(channel,value){
  if(busy)return;
  busy=true;

  document.querySelectorAll("[data-relay]")
    .forEach(b=>b.disabled=true);

  try{
    const data=await request("/api/relay",{
      method:"POST",
      auth:true,
      body:JSON.stringify({channel,relay:value})
    });

    updateRelay("relay1",data.relay1);
    updateRelay("relay2",data.relay2);

    $("updated").textContent=new Date().toLocaleTimeString();
  }catch(e){
    alert("Control failed: "+e.message);
  }finally{
    busy=false;
    document.querySelectorAll("[data-relay]")
      .forEach(b=>b.disabled=false);
  }
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  $("error").textContent="";

  try{
    const data=await request("/api/login",{
      method:"POST",
      body:JSON.stringify({password:$("password").value})
    });

    if(!data.token)throw new Error("Token missing");

    token=data.token;
    sessionStorage.setItem("iot_token",token);
    $("password").value="";

    showDashboard();
    await refreshStatus();

    clearInterval(timer);
    timer=setInterval(refreshStatus,3000);
  }catch(e){
    $("error").textContent=e.message;
  }
});

document.querySelectorAll("[data-relay]").forEach(button=>{
  button.addEventListener("click",()=>{
    setRelay(button.dataset.relay,button.dataset.value);
  });
});

$("refresh").addEventListener("click",refreshStatus);
$("logout").addEventListener("click",logout);

if(token){
  showDashboard();
  refreshStatus().then(()=>{
    timer=setInterval(refreshStatus,3000);
  });
}
</script>
</body>
</html>
